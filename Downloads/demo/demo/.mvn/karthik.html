<!DOCTYPE html>
<html>
<head>
  <title>Code Crusiders</title>
  <style>
    body {
      background: linear-gradient(135deg, #00f2fe, #ff4ecd);
      font-family: Arial;
      text-align: center;
      padding-top: 90px;
    }
    .box {
      background: #ffffff;
      width: 360px;
      margin: auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    input, button {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
    }
    button {
      background: #00e676;
      color: black;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
<div class="box">
  <h2>🚀 Code Crusiders</h2>
  <p>Lost & Found Platform</p>

  <form action="/saveUser" method="post">
    <input name="name" placeholder="Enter your name" required>
    <input name="phone" placeholder="Phone number" required>
    <button>Continue</button>
  </form>
</div>
</body>
</html>
